const XIANG_COLOR = { '青龙':'#5fc4a8', '玄武':'#7f93c4', '白虎':'#d4d2c9', '朱雀':'#c96a5a' };
const YUAN_COLOR = { '紫微垣':'#d6c48c', '太微垣':'#b8a7d9', '天市垣':'#9cc4a8' };

/* ---- 月亮实时位置（Meeus 低精度，误差 ~0.5°） ---- */
function julianDate(){
  const now = new Date();
  const y = now.getUTCFullYear(), m = now.getUTCMonth()+1, d = now.getUTCDate();
  const h = now.getUTCHours() + now.getUTCMinutes()/60;
  let yy = y, mm = m;
  if (mm <= 2){ yy--; mm += 12; }
  const A = Math.floor(yy/100), B = 2 - A + Math.floor(A/4);
  const jd = Math.floor(365.25*(yy+4716)) + Math.floor(30.6001*(mm+1)) + d + B - 1524.5 + h/24;
  return jd;
}
function moonPosition(){
  const d = julianDate() - 2451545.0;
  const Lp = 218.316 + 13.176396*d;
  const M  = 357.5291 + 0.98560028*d;
  const D  = 297.8502 + 12.190749*d;
  const Mp = 134.9634 + 13.064993*d;
  const r  = Math.PI/180;
  let lam = Lp + 6.289*Math.sin(Mp*r) + 1.274*Math.sin((2*D-Mp)*r)
      + 0.658*Math.sin(2*D*r) + 0.214*Math.sin(2*Mp*r)
      - 0.186*Math.sin(M*r) - 0.114*Math.sin((2*M-Mp)*r)
      - 0.059*Math.sin((2*D-2*Mp)*r) + 0.057*Math.sin((2*D-M-Mp)*r)
      + 0.053*Math.sin((2*D+Mp)*r);
  lam = ((lam % 360) + 360) % 360;
  let bet = 5.128*Math.sin(Mp*r) + 0.280*Math.sin((2*D+Mp)*r)
      + 0.278*Math.sin((2*D-Mp)*r) + 0.173*Math.sin((M-Mp)*r)
      + 0.055*Math.sin((M+Mp)*r);
  const eps = 23.4393 - 0.0000004*d;
  const lr = lam*r, br = bet*r, er = eps*r;
  let ra = Math.atan2(Math.sin(lr)*Math.cos(er) - Math.tan(br)*Math.sin(er), Math.cos(lr))/r;
  if (ra < 0) ra += 360;
  const dec = Math.asin(Math.sin(br)*Math.cos(er) + Math.cos(br)*Math.sin(er)*Math.sin(lr))/r;
  /* 月相：太阳-月亮黄经差 */
  const Lsun = 280.4665 + 0.98564736*d;
  let phase = ((lam - Lsun) % 360 + 360) % 360;
  return { ra, dec, phase };
}


const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const infoEl = document.getElementById('info');

/* ---- 北天极立体投影 ----
   dec = 90° 在圆心；ρ 与 tan((90-dec)/2) 成正比；
   显示到 dec = -52°（覆盖黄道带与南侧尾宿），黄道赤纬 ±23.5 成环 */
let cx = 0, cy = 0, R = 0, Rmax = 0;
const MAX_DEC = -52;
function layout(){
  const s = Math.min(canvas.width, canvas.height);
  cx = canvas.width/2; cy = canvas.height/2;
  Rmax = s * 1.38;                    // 投影放大 3 倍：圆盘超出画布，边缘被裁剪（放大特写）
  R = Rmax * Math.tan(Math.PI/4) / Math.tan(((90-MAX_DEC)/2)*Math.PI/180); // 赤道圈
}
function project(ra, dec){
  const rho = R * Math.tan(((90-dec)/2)*Math.PI/180) / Math.tan(Math.PI/4);
  const th = ra * Math.PI/180;
  return { x: cx + rho*Math.sin(th), y: cy - rho*Math.cos(th), rho };
}

/* 数据预处理 */
let suList = [];
let yuanList = [];
function buildAll(){
  layout();
  yuanList = YUAN.map(([yuan, guan, arr]) => {
    const pts = arr.map(([ra,dec,mag,rgb,name,modern,cnst]) => {
      const p = project(ra, dec);
      return { ...p, mag, rgb, name, modern, cnst };
    });
    return { yuan, guan, pts, act:0, hit:-1 };
  });
  suList = SU.map(([su, xiang, arr]) => {
    const pts = arr.map(([ra,dec,mag,rgb,name,modern,cnst]) => {
      const p = project(ra, dec);
      return { ...p, mag, rgb, name, modern, cnst };
    });
    return { su, xiang, pts, act:0, hit:-1 };
  });
}
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; buildAll(); }
addEventListener('resize', resize);
resize();

let mx = innerWidth/2, my = innerHeight/2, sx = mx, sy = my, t = 0;
addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

const HIT = 42;
const DASH = [6,4,2,5];
function starSize(mag){ return Math.min(3.2, Math.max(0.6, 2.7 - mag*0.34)); }

function drawRings(){
  /* 天赤道圈 */
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(138,133,120,0.30)'; ctx.lineWidth = 1; ctx.setLineDash([2,6]); ctx.stroke();
  /* 黄道带（±8°，月亮太阳行经带） */
  ctx.setLineDash([]);
  for (const off of [-8, 8]){
    const r = R * Math.tan(((90-off)/2)*Math.PI/180) / Math.tan(Math.PI/4);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(201,169,97,0.18)'; ctx.lineWidth = 0.6; ctx.stroke();
  }
  /* 外圈 */
  ctx.beginPath(); ctx.arc(cx, cy, Rmax, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(233,228,216,0.25)'; ctx.lineWidth = 1; ctx.stroke();
  /* 十字经线 */
  ctx.setLineDash([1,5]); ctx.strokeStyle = 'rgba(138,133,120,0.15)'; ctx.lineWidth = 0.6;
  for (const ra of [0, 90, 180, -90]){
    const p1 = project(ra, MAX_DEC), p0 = project(ra, 90);
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
  }
  ctx.setLineDash([]);
}


/* ---- 月亮绘制 + 所在宿判定 ---- */
let moonInfo = '';
function drawMoon(){
  const m = moonPosition();
  const p = project(m.ra, m.dec);
  /* 所在宿：按赤经距离最近宿判定 */
  let best='', bd=1e9;
  for (const s of suList){
    for (const q of s.pts){
      let dra = Math.abs(q.ra - m.ra); dra = Math.min(dra, 360-dra);
      const dd = Math.abs(q.dec - m.dec);
      const d2 = Math.hypot(dra, dd);
      if (d2 < bd){ bd = d2; best = s.su; }
    }
  }
  /* 月相名 */
  const ph = m.phase;
  const phName = ph < 6 || ph >= 354 ? '新月' : ph < 90 ? '蛾眉月' : ph < 96 ? '上弦' :
                 ph < 180 ? '盈凸月' : ph < 186 ? '满月' : ph < 270 ? '亏凸月' : ph < 276 ? '下弦' : '残月';
  const pct = Math.round(((ph+180)%360)/3.6);
  moonInfo = `月亮 · ${best}宿 · ${phName} ${pct}%`;
  /* 月亮本体（金色圆盘，画在星上层） */
  if (p.rho > Rmax + 8) return; // 超出圆盘不画
  const glow = 5.5;
  const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glow*3);
  grad.addColorStop(0, 'rgba(255,236,180,0.55)');
  grad.addColorStop(1, 'rgba(255,236,180,0)');
  ctx.beginPath(); ctx.arc(p.x, p.y, glow*3, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath(); ctx.arc(p.x, p.y, glow, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,238,190,0.95)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,130,0.6)'; ctx.lineWidth = 0.8; ctx.stroke();
  /* 月相缺口（简示：按相位画暗斑） */
  const dark = Math.abs(Math.sin((ph)*Math.PI/180));
  ctx.beginPath(); ctx.arc(p.x - glow*0.5*dark, p.y, glow*0.75, 0, Math.PI*2);
  ctx.fillStyle = `rgba(11,13,18,${0.35*dark})`; ctx.fill();
}

/* ---- 月亮信息角标 ---- */
function drawMoonBadge(){
  if (!moonInfo) return;
  ctx.save();
  ctx.font = '11px -apple-system,"PingFang SC",sans-serif';
  const tw = ctx.measureText(moonInfo).width;
  const bx = 24, by = 26;
  ctx.fillStyle = 'rgba(11,13,18,0.7)';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(bx-8, by-16, tw+16, 22, 6) : ctx.rect(bx-8, by-16, tw+16, 22);
  ctx.fill();
  ctx.fillStyle = '#e9d9a8'; ctx.textAlign = 'left';
  ctx.fillText(moonInfo, bx, by);
  ctx.restore();
}

function animate(){
  t += 0.01;
  sx += (mx-sx)*0.08; sy += (my-sy)*0.08;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawRings();
  drawMoon();

  /* 激活判定 */
  for (const s of suList){
    let best = Infinity, bi = -1;
    for (let i=0;i<s.pts.length;i++){
      const d = (sx-s.pts[i].x)**2 + (sy-s.pts[i].y)**2;
      if (d<best){ best=d; bi=i; }
    }
    const target = best < HIT*HIT ? 1 : 0;
    s.act += (target - s.act)*0.1;
    s.hit = bi;
  }
  /* 三垣星官激活 */
  for (const s of yuanList){
    let best = Infinity, bi = -1;
    for (let i=0;i<s.pts.length;i++){
      const d = (sx-s.pts[i].x)**2 + (sy-s.pts[i].y)**2;
      if (d<best){ best=d; bi=i; }
    }
    const target = best < HIT*HIT ? 1 : 0;
    s.act += (target - s.act)*0.1;
    s.hit = bi;
  }

  /* 宿内连线（激活渐显） */
  for (const s of suList){
    if (s.act < 0.03) continue;
    ctx.save();
    ctx.globalAlpha = s.act;
    ctx.strokeStyle = XIANG_COLOR[s.xiang];
    ctx.setLineDash(DASH); ctx.lineWidth = 0.8;
    ctx.beginPath();
    const p0 = s.pts[0]; ctx.moveTo(p0.x, p0.y);
    for (let i=1;i<s.pts.length;i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
    ctx.stroke();
    ctx.restore();
  }

  /* 三垣星官连线 */
  for (const s of yuanList){
    if (s.act < 0.05 || s.pts.length < 2) continue;
    ctx.save();
    ctx.globalAlpha = s.act * 0.7;
    ctx.strokeStyle = YUAN_COLOR[s.yuan];
    ctx.setLineDash([3,4]); ctx.lineWidth = 0.5;
    ctx.beginPath();
    const p0 = s.pts[0]; ctx.moveTo(p0.x, p0.y);
    for (let i=1;i<s.pts.length;i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
    ctx.stroke();
    ctx.restore();
  }

  /* 星点 */
  for (const s of suList){
    for (const p of s.pts){
      const tw = (Math.sin(t*0.7 + p.x*0.02) + 1)/2;
      const size = starSize(p.mag) * (1 + tw*0.12);
      const act = s.act;
      if (p.mag <= 1.5){
        ctx.beginPath(); ctx.arc(p.x, p.y, size*3, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${p.rgb},${0.08 + act*0.10})`; ctx.fill();
      }
      ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, Math.PI*2);
      const alpha = act > 0.02 ? Math.min(1, 0.5 - p.mag*0.05 + tw*0.15 + act*0.4)
                               : Math.min(0.55, 0.3 - p.mag*0.04 + tw*0.12);
      ctx.fillStyle = `rgba(${p.rgb},${alpha})`; ctx.fill();
      if (act > 0.5 && p === s.pts[s.hit]){
        ctx.beginPath(); ctx.arc(p.x, p.y, size+3, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(255,255,255,${act*0.35})`; ctx.lineWidth = 1; ctx.stroke();
      }
    }
  }

  /* 三垣星点（中央区，常驻弱显 + 激活渐显） */
  for (const s of yuanList){
    for (const p of s.pts){
      const tw = (Math.sin(t*0.6 + p.x*0.03) + 1)/2;
      const size = Math.min(2.6, Math.max(0.7, 2.3 - p.mag*0.3)) * (1 + tw*0.1);
      const act = s.act;
      ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, Math.PI*2);
      const alpha = act > 0.02 ? Math.min(0.9, 0.35 - p.mag*0.04 + tw*0.1 + act*0.45)
                               : Math.min(0.45, 0.22 - p.mag*0.03 + tw*0.08);
      ctx.fillStyle = `rgba(${p.rgb},${alpha})`;
      ctx.fill();
      if (act > 0.5 && p === s.pts[s.hit]){
        ctx.beginPath(); ctx.arc(p.x, p.y, size+2.5, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(255,255,255,${act*0.3})`; ctx.lineWidth = 0.8; ctx.stroke();
      }
    }
  }

  /* 三垣星官名标签 */
  for (const s of yuanList){
    if (s.act < 0.35) continue;
    const a = (s.act-0.35)/0.65;
    const gx = s.pts.reduce((a,p)=>a+p.x,0)/s.pts.length;
    const gy = s.pts.reduce((a,p)=>a+p.y,0)/s.pts.length;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a);
    ctx.textAlign = 'center';
    ctx.fillStyle = YUAN_COLOR[s.yuan];
    ctx.font = '500 12px "PingFang SC","Songti SC",serif';
    ctx.fillText(s.guan, gx, gy - 8);
    ctx.restore();
  }

  /* 宿名标签 */
  for (const s of suList){
    if (s.act < 0.25) continue;
    const a = (s.act-0.25)/0.75;
    /* 标签放在宿重心沿径向向外 */
    let gx=0, gy=0;
    for (const p of s.pts){ gx+=p.x; gy+=p.y; }
    gx/=s.pts.length; gy/=s.pts.length;
    const dx = gx-cx, dy = gy-cy, dl = Math.hypot(dx,dy)||1;
    const tx = gx + dx/dl*22, ty = gy + dy/dl*22;
    ctx.save();
    ctx.globalAlpha = Math.min(1, a);
    ctx.textAlign = 'center';
    ctx.fillStyle = XIANG_COLOR[s.xiang];
    ctx.font = '600 15px "PingFang SC","Songti SC",serif';
    ctx.fillText(s.su+'宿', tx, ty-8);
    ctx.font = '10px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(233,228,216,0.7)';
    ctx.fillText(ANIMAL[s.xiang]+' · '+s.pts.length+'星', tx, ty+8);
    ctx.restore();
  }

  /* 信息卡 */
  let shown = false;
  for (const s of suList){
    if (s.act > 0.5 && s.hit >= 0 && !shown){
      const p = s.pts[s.hit];
      infoEl.style.display = 'block';
      infoEl.innerHTML = `
        <div class="gname">${s.su}宿 · ${p.name}</div>
        <div class="mname">${p.modern} · ${p.cnst}</div>
        <div style="color:${XIANG_COLOR[s.xiang]}">${ANIMAL[s.xiang]} · ${XIANG_SEASON[s.xiang]} · 视星等 ${p.mag.toFixed(2)}</div>`;
      shown = true;
    }
  }
  for (const s of yuanList){
    if (s.act > 0.5 && s.hit >= 0 && !shown){
      const p = s.pts[s.hit];
      infoEl.style.display = 'block';
      infoEl.innerHTML = `
        <div class="gname">${s.yuan} · ${s.guan}</div>
        <div class="mname">${p.name} · ${p.modern} · ${p.cnst}</div>
        <div style="color:${YUAN_COLOR[s.yuan]}">${s.yuan}星官 · 视星等 ${p.mag.toFixed(2)}</div>`;
      shown = true;
    }
  }
  if (!shown) infoEl.style.display = 'none';
  drawMoonBadge();

  requestAnimationFrame(animate);
}
animate();
</script>
</body>

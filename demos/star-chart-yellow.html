/* 数据（脚本内嵌）：SKY = 88 星座连线 GeoJSON；STARS = [RA, Dec, mag, "r,g,b"]（B-V 真实色） */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const LINE_COLOR = (a) => `rgba(100,160,255,${a})`;
const DASH_PATTERN = [5, 3, 2, 6]; // 不均匀虚线

/* 红星修正：B-V→RGB 表的红色端截断在橙色（最红仅 rgb(255,212,120)），
   把最暖一档（R-B>100 的 K/M 星）平滑推到橙红/红。
   紫色不存在于真实星光（恒星光谱只有蓝→红），无需处理 */
const REDDEN = (s) => {
  if (Math.abs(s[0]-8879) < 30 && Math.abs(s[1]-741) < 30){ s[3] = '255,140,80'; return; } // 参宿四：表中 B-V 用低了（实为 1.85）
  const [r, g, b] = s[3].split(',').map(Number);
  const d = r - b;
  if (d <= 100) return;
  const f = Math.min(1, (d-100)/35) ** 0.8;
  s[3] = `${r},${Math.round(g - (g-110)*0.85*f)},${Math.round(b*(1-0.55*f))}`;
};
STARS.forEach(REDDEN);

let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
let smoothX = mouseX, smoothY = mouseY, t = 0;
window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

/* 天空布局：等距圆柱投影，全天空 360×180 等比缩放居中 */
let skyScale = 1, skyOx = 0, skyOy = 0;
function layoutSky(){
  skyScale = Math.min(canvas.width / 360, canvas.height / 180);
  skyOx = (canvas.width - 360*skyScale) / 2;
  skyOy = (canvas.height - 180*skyScale) / 2;
}
const px = (ra) => (ra + 180) / 360 * 360 * skyScale + skyOx;
const py = (dec) => (90 - dec) / 180 * 180 * skyScale + skyOy;

/* ---------- 88 真实星座（IAU 数据） ----------
   RA 是天球环（-180~180 即 24h），跨 0h 的星座先绕环连续化，再按平均 RA 平移回可见范围。
   resize 时整体重建（buildAll）：星座/亮星/成员星一起缩放重排，窗口拉扯不错位 */
let constellations = [];
let brightPts = [];

function buildSky(){
  return Object.entries(SKY).map(([id, segs]) => {
    const pts = new Map(); // 去重星点
    const ra0 = segs[0][0][0];
    let raAdj = [];
    for (const seg of segs){
      for (const [ra] of seg){
        let ra2 = ra;
        while (ra2 - ra0 > 180) ra2 -= 360;
        while (ra2 - ra0 < -180) ra2 += 360;
        raAdj.push(ra2);
      }
    }
    const raMid = raAdj.reduce((s, r) => s + r, 0) / raAdj.length;
    const shift = Math.round(raMid / 360) * 360;
    const lines = [];
    for (const seg of segs){
      const segPts = seg.map(([ra, dec]) => {
        let ra2 = ra;
        while (ra2 - ra0 > 180) ra2 -= 360;
        while (ra2 - ra0 < -180) ra2 += 360;
        ra2 -= shift;
        const key = ra2.toFixed(2) + ',' + dec.toFixed(2);
        if (!pts.has(key)) pts.set(key, { x: px(ra2), y: py(dec) });
        return pts.get(key);
      });
      lines.push(segPts);
    }
    const starPts = [...pts.values()];
    const cx = starPts.reduce((s,p) => s+p.x, 0) / starPts.length;
    const cy = starPts.reduce((s,p) => s+p.y, 0) / starPts.length;
    return { id, lines, pts: starPts, cx, cy, act: 0, ra0, shift };
  });
}

/* 成员星匹配：STARS 的 RA 做与星座相同的连续化 + 平移（跨 0h 星座与连线对齐） */
function rebuildMembers(){
  for (const c of constellations){
    const adjust = (s) => {
      let ra2 = s[0]/100;
      while (ra2 - c.ra0 > 180) ra2 -= 360;
      while (ra2 - c.ra0 < -180) ra2 += 360;
      ra2 -= c.shift;
      return { x: px(ra2), y: py(s[1]/100), s };
    };
    c.members = STARS.filter((s) =>
      c.pts.some((p) => Math.hypot(p.x-adjust(s).x, p.y-adjust(s).y) < 14)
    ).map(adjust);
  }
}

function buildAll(){
  layoutSky();
  constellations = buildSky();
  brightPts = STARS.filter((s) => s[2] <= 150).map((s) => ({ x: px(s[0]/100), y: py(s[1]/100), s }));
  rebuildMembers();
}

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  buildAll();
}
window.addEventListener('resize', resize);
resize();

const HIT = 55; // 星座命中半径 px（距最近星点）


function animate(){
  t += 0.01;
  smoothX += (mouseX - smoothX) * 0.08;
  smoothY += (mouseY - smoothY) * 0.08;

  ctx.clearRect(0,0,canvas.width, canvas.height);

  /* 星座激活判定（每星座独立） */
  for (const c of constellations){
    let best = Infinity;
    for (const p of c.pts){
      const d = (smoothX-p.x)**2 + (smoothY-p.y)**2;
      if (d < best) best = d;
    }
    const target = best < HIT*HIT ? 1 : 0;
    c.act += (target - c.act) * 0.08;
  }

  /* 星座连线：先画在星星下层，避免蓝线盖住星体 */
  for (const c of constellations){
    const act = c.act;
    if (act > 0.02){
      ctx.globalAlpha = act;
      ctx.lineWidth = act > 0.9 ? 0.5 : 0.4;
      ctx.strokeStyle = LINE_COLOR(0.72);
      for (const seg of c.lines){
        ctx.beginPath();
        ctx.moveTo(seg[0].x, seg[0].y);
        for (let i=1;i<seg.length;i++) ctx.lineTo(seg[i].x, seg[i].y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  /* 常驻：只画 20 颗最亮星（mag≤1.5）：纯白核心 + 星球真实色光晕 */
  for (const b of brightPts){
    const s = b.s;
    const x = b.x;
    const y = b.y;
    const mag = s[2]/100;
    const tw = (Math.sin(t*0.8 + s[0]*0.07) + 1) / 2;
    const size = Math.min(3.0, Math.max(0.7, 2.6 - mag*0.42)) * (1 + tw*0.15);
    let alpha = Math.min(1.0, 0.62 - mag*0.05 + tw*0.18);
    const d = Math.hypot(smoothX-x, smoothY-y);
    if (d < 90){
      const tt = 1 - d/90;
      alpha = Math.min(1, alpha + tt*0.4);
    }
    // 光晕：星球真实色，径向渐变向外淡出（一等星更大）
    const glowR = size * (mag <= 0.5 ? 3.4 : 2.2);
    const grad = ctx.createRadialGradient(x, y, 0, x, y, glowR);
    grad.addColorStop(0, `rgba(${s[3]},${alpha*0.45})`);
    grad.addColorStop(0.6, `rgba(${s[3]},${alpha*0.18})`);
    grad.addColorStop(1, `rgba(${s[3]},0)`);
    ctx.beginPath();
    ctx.arc(x, y, glowR, 0, Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();
    // 核心：纯白
    ctx.beginPath();
    ctx.arc(x, y, size*0.5, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }

  /* 星座：点亮时显示该星座成员星（真实色）+ 名字（连线已在星星下层画好） */
  for (const c of constellations){
    const act = c.act;
    if (act > 0.02){
      // 成员星：真实 B-V 颜色，随激活度显现
      for (const m of c.members){
        const s = m.s;
        const mx = m.x, my = m.y;
        const tw = (Math.sin(t*0.8 + s[0]*0.07) + 1) / 2;
        const size = Math.min(3.0, Math.max(0.7, 2.6 - s[2]*0.0042)) * (1 + tw*0.15);
        const alpha = Math.min(1, (0.5 - s[2]*0.0006 + tw*0.18) * (0.45 + act*0.55));
        ctx.beginPath();
        ctx.arc(mx, my, size, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${s[3]},${alpha})`;
        ctx.fill();
      }
    }
    if (act > 0.5){
      ctx.globalAlpha = (act - 0.5) * 2;
      ctx.fillStyle = '#f2e3b3';
      ctx.font = '11px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(c.id, c.cx, c.cy - 8);
      ctx.globalAlpha = 1;
    }
  }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图标尺寸对比 —— FLY 顶栏 / 侧栏</title>
<style>
  :root { --bg: #0b0b12; --side: #141414; --icon: #9a9aa8; --icon-on: #fff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: #e8e8ee;
    font: 13px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  h1 { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .hint { color: #8a8a96; margin: 0 0 18px; font-size: 12px; }
  .panel { background: var(--side); border: 1px solid rgba(255,255,255,.06); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .caption { font-size: 11px; color: #6f6f7c; padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,.05); }

  /* 复刻 app 的顶部 40px：三点在左（native），图标行在右 */
  .topbar {
    position: relative; height: 40px; width: 100%;
    background: radial-gradient(120% 100% at 30% 0%, #1a1430 0%, #0b0b12 70%);
  }
  .lights { position: absolute; left: 14px; top: 14px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .lights i:nth-child(1) { background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; }
  .lights i:nth-child(3) { background: #28c840; }

  /* 图标行：height 40 + paddingTop 8 + align-items center → 图标中心 y=24（当前线上值） */
  .iconrow {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: flex-end; gap: 2px; padding-right: 12px;
  }
  .btn {
    width: 34px; height: 30px; display: flex; align-items: center; justify-content: center;
    color: var(--icon); position: relative; border-radius: 8px; background: transparent;
  }
  .btn.on { color: var(--icon-on); background: linear-gradient(90deg, rgba(255,255,255,.28), rgba(255,255,255,.08) 70%, transparent); }
  .btn svg { display: block; }
  .badge {
    position: absolute; top: -1px; right: -1px; font-size: 8px; line-height: 1;
    padding: 1px 3px; border-radius: 6px; background: #2a2a34; color: #d8d8e2;
    font-family: ui-monospace, SFMono-Regular, monospace; pointer-events: none;
  }

  /* 多尺寸网格：每个尺寸一行，便于逐行比较 */
  .grid { display: flex; flex-direction: column; }
  .sizerow { display: flex; align-items: center; gap: 14px; padding: 8px 12px; border-top: 1px solid rgba(255,255,255,.04); }
  .sizerow:first-child { border-top: none; }
  .tag { width: 74px; flex: none; color: #8a8a96; font-size: 11px; font-family: ui-monospace, monospace; }
  .tag.cur { color: #ffd479; }
  .sample { display: flex; align-items: center; gap: 2px; }

  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  input[type=range] { width: 260px; }
  .num { font-family: ui-monospace, monospace; color: #ffd479; font-size: 15px; min-width: 74px; }
  button {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer;
    background: rgba(255,255,255,.06); color: #e8e8ee; border: 1px solid rgba(255,255,255,.1);
  }
  button:hover { background: rgba(255,255,255,.12); }
  code { color: #9ad; }
</style>
</head>
<body>
  <h1>图标尺寸对比</h1>
  <p class="hint">
    左侧三个点是 macOS 原生红黄绿按钮的**真实尺寸与位置**（12px 圆点 / 左 14px / 距顶 14–26，中心 y=22）——
    图标多大才和它们"一家人"，靠这个比。<strong>拖下面的滑块，找到顺眼的那一档，把数字告诉我。</strong>
  </p>

  <div class="controls" style="margin-bottom:14px">
    <span class="num" id="num">18 px</span>
    <input type="range" id="size" min="12" max="26" step="1" value="18">
    <button data-s="14">14</button>
    <button data-s="16">16</button>
    <button data-s="18">18</button>
    <button data-s="20">20</button>
    <button data-s="22">22</button>
    <span class="hint" style="margin:0" id="stroke"></span>
  </div>

  <div class="panel">
    <div class="caption">顶栏（文件 / 画布 / 模板）—— 拖拽区在左，按钮组在右</div>
    <div class="topbar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="iconrow" id="rowTop"></div>
    </div>
  </div>

  <div class="panel">
    <div class="caption">侧栏顶部（技能 / API）—— 同样高度 40、右对齐，与顶栏同尺寸</div>
    <div class="topbar" style="background: var(--side)">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="iconrow" id="rowSide" style="padding-right: 8px"></div>
    </div>
  </div>

  <div class="panel">
    <div class="caption">逐档并排（含"选中态"高亮与数字角标，都在真实底色上）</div>
    <div class="grid" id="grid"></div>
  </div>

<script>
// icons：与 frontend/components/UiIcon.tsx 的 UI_ICONS 完全一致（Lucide 官方标记）
const ICONS = {
  files: '<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  canvas: '<rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/>',
  templates: '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  skills: '<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/>',
  api: '<path d="M12 22v-5"/><path d="M15 8V2"/><path d="M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1z"/><path d="M9 8V2"/>',
};

function svg(name, size) {
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
}
function btn(name, size, { on = false, badge = 0 } = {}) {
  return `<span class="btn${on ? " on" : ""}">${svg(name, size)}${badge ? `<span class="badge">${badge}</span>` : ""}</span>`;
}

const rowTop = document.getElementById("rowTop");
const rowSide = document.getElementById("rowSide");
const grid = document.getElementById("grid");
const num = document.getElementById("num");
const strokeLabel = document.getElementById("stroke");

// stroke 是 viewBox 里的 2px，实际线宽 = 2 × size/24
function strokeInfo(size) {
  strokeLabel.textContent = `实际线宽 ≈ ${(2 * size / 24).toFixed(2)} px`;
}

function render(size) {
  num.textContent = size + " px";
  strokeInfo(size);
  rowTop.innerHTML =
    btn("files", size, { badge: 3 }) + btn("canvas", size, { badge: 8 }) + btn("templates", size);
  rowSide.innerHTML = btn("skills", size) + btn("api", size, { on: true });

  const steps = [12, 14, 16, 18, 20, 22, 24, 26];
  grid.innerHTML = steps.map((s) => `
    <div class="sizerow">
      <span class="tag${s === size ? " cur" : ""}">${s} px${s === size ? " ←" : ""}</span>
      <span class="sample">
        ${btn("files", s, { badge: 3 })}${btn("canvas", s, { badge: 8 })}${btn("templates", s)}
      </span>
      <span class="sample">
        ${btn("skills", s)}${btn("api", s, { on: true })}
      </span>
      <span style="color:#6f6f7c;font-size:11px">线宽 ≈ ${(2 * s / 24).toFixed(2)}px</span>
    </div>`).join("");
}

const slider = document.getElementById("size");
slider.addEventListener("input", (e) => render(Number(e.target.value)));
document.querySelectorAll("button[data-s]").forEach((b) =>
  b.addEventListener("click", () => { slider.value = b.dataset.s; render(Number(b.dataset.s)); })
);
render(18);
</script>
</body>
</html>

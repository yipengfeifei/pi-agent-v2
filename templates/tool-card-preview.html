<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工具活动条目预览（打字机版）</title>
<style>
  :root {
    --bg: #1a1a1a;
    --text: #ececf1;
    --text-muted: #9b9ba4;
    --text-dim: #6b6b74;
    --status-running: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 40px 20px;
  }
  .wrap { max-width: 820px; margin: 0 auto; display: grid; gap: 10px; }
  .hint { text-align: center; color: var(--text-dim); font-size: 12px; margin-bottom: 18px; line-height: 1.7; }
  .hint b { color: var(--text-muted); }

  .row { display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 24px; }
  .desc { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* lucide 工具图标：代替原工具名小字 */
  .ticon { flex-shrink: 0; width: 15px; height: 15px; color: var(--text-dim); display: flex; }
  .ticon svg { width: 15px; height: 15px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(0.85); box-shadow: 0 0 14px rgba(245,158,11,.5); } }

  /* 打字机：逐字出现 → 逐字消失（循环） */
  .typewriter { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .typewriter::after { content: "▍"; margin-left: 1px; opacity: .7; animation: caret 0.7s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="hint">运行中 = <b>思考文字打字机</b>：描述逐字出现、再逐字消失，循环。<br>完成 = lucide 工具图标 + 描述（静态）；失败同完成。</div>

  <!-- 运行中：图标 + 打字机文字 -->
  <div class="row">
    <span class="ticon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
    </span>
    <span class="typewriter" id="tw"></span>
  </div>

  <!-- 完成：lucide 图标代替工具名 -->
  <div class="row">
    <span class="ticon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
    </span>
    <span class="desc">请求 Bing.com 并分析页面结构</span>
  </div>

  <div class="row">
    <span class="ticon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h8"/><path d="m4 17 6-6-6-6"/></svg>
    </span>
    <span class="desc">curl 抓取 bing.com 首页并统计结构</span>
  </div>

  <div class="row">
    <span class="ticon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
    </span>
    <span class="desc">写入 /Users/yipengfei/Desktop/pi Agent V2/bing_页面结构分析报告.md</span>
  </div>
</div>

<script>
// 打字机：逐字出现到末尾 → 逐字消失到空 → 循环
var TEXT = "请求 Bing.com 并分析页面结构";
var el = document.getElementById("tw");
var i = 0, dir = 1;
(function tick() {
  el.textContent = TEXT.slice(0, i);
  i += dir;
  if (i > TEXT.length) { i = TEXT.length - 1; dir = -1; }
  else if (i < 0) { i = 1; dir = 1; }
  setTimeout(tick, 90);
})();
</script>

</body>
</html>

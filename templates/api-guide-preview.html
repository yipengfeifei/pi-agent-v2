<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 引导页预览（旧 ApiGuide 静态还原）</title>
<style>
  :root {
    --bg: #1a1a1a;
    --bg-panel: #242424;
    --border: rgba(255,255,255,0.12);
    --text: #ececf1;
    --text-muted: #9b9ba4;
    --text-dim: #6b6b74;
    --accent: #5aa2f0;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  header { border-bottom: 1px solid var(--border); padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16; }
  header .t { font-size: 16px; font-weight: 750; }
  header .s { margin-top: 3px; font-size: 12px; color: var(--text-muted); }
  header .x { width: 30px; height: 30px; border: none; border-radius: 7px; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 20px; line-height: 1; }
  header .x:hover { background: var(--bg-panel); }
  section { overflow: auto; padding: 26px 26px 10px; display: grid; align-content: start; gap: 18; justify-items: center; }
  .big { font-size: 24px; font-weight: 900; line-height: 1.08; }
  .status { font-size: 11px; font-weight: 750; color: var(--text-muted); margin-top: 4px; }
  .msg { max-width: min(760px, 94%); font-size: 16px; font-weight: 650; line-height: 1.65; white-space: pre-wrap; text-align: center; }
  footer { padding: 8px 24px 18px; display: grid; grid-template-columns: 1fr auto; gap: 10; align-items: end; }
  textarea { width: 100%; min-height: 70px; max-height: 150px; border: none; background: transparent; color: var(--text); caret-color: var(--accent); padding: 12px 18px 8px; resize: vertical; outline: none; line-height: 1.45; font-size: 16px; font-weight: 650; font-family: inherit; text-align: center; }
  .send { height: 42px; border: none; background: transparent; color: var(--text); padding: 0 4px; font-size: 12px; font-weight: 850; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div>
    <div class="t">API</div>
    <div class="s">让 AI 读接入文档、查配置资料，并写入本机 models.json。</div>
  </div>
  <button class="x">x</button>
</header>

<section>
  <div style="display:grid; gap:4px; justify-items:center; text-align:center;">
    <div class="big">API AI</div>
    <div class="status">API 接入引导</div>
  </div>
  <div class="msg">你想先了解这个 App 的 Session / Workflow 是怎么工作的，还是直接配置 API？如果要配 API，可以发平台名、Base URL、文档链接或 API Key。</div>
</section>

<footer>
  <textarea placeholder="告诉我你要接入哪个 API..." rows="3"></textarea>
  <button class="send">Send</button>
</footer>

</body>
</html>
